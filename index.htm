                const target = targetType === 'player' ? S.players[targetId] : S.npcs[targetId];
                if (!target || target.isDead) { Game.clearTarget(); return; }
                const d = Util.dist(me.x + C.PLAYER_RADIUS, me.y + C.PLAYER_RADIUS, target.x + C.PLAYER_RADIUS, target.y + C.PLAYER_RADIUS);
                if (d > C.ATTACK_RANGE) { Chat.log('You are too far away to attack.', 'system'); return; }
                Util.trigger(me.el, 'melee-attack-lunge');
                S.attackCD = true; setTimeout(() => { S.attackCD = false; }, C.ATTACK_CD);
                if (fromLocal) Net.send({ type: 'attack', targetId, targetType });
            },
            playerDeath: (p, killer) => {
                if (!Net.isHost() || p.gold <= 0) return;
                let drop = killer.id.startsWith('npc_') ? Math.floor(p.gold / 2) : p.gold;
                if (drop > 0) {
                    p.gold -= drop; Net.broadcast({ type: 'update-gold', playerId: p.id, gold: p.gold });
                    const a = Math.random() * 2 * Math.PI, r = Math.random() * C.GOLD_RADIUS;
                    const ix = p.x + C.PLAYER_RADIUS + Math.cos(a) * r - C.GOLD_SIZE / 2;
                    const iy = p.y + C.PLAYER_RADIUS + Math.sin(a) * r - C.GOLD_SIZE / 2;
                    const item = { id: `gold_${Date.now()}_${Math.random()}`, type: 'gold', amount: drop, x: ix, y: iy };
                    Entities.createItem(item); Net.broadcast({ type: 'spawn-item', item });
                    Combat.announce(`${p.name} dropped ${drop} gold!`);
                }
            },
            dropGold: (p, killer) => Combat.playerDeath(p, killer),
            dropSlimeGold: (npc) => {
                const isMage = npc.kind === 'mage';
                const amount = isMage ? C.MAGE_GOLD : C.SLIME_GOLD;
                const item = { id: `gold_${Date.now()}_${Math.random()}`, type: 'gold', amount, x: npc.x + (C.PLAYER_RADIUS - C.GOLD_SIZE / 2), y: npc.y + (C.PLAYER_RADIUS - C.GOLD_SIZE / 2) };
                Entities.createItem(item); Net.broadcast({ type: 'spawn-item', item });
                if (isMage) Combat.announce(`${npc.name || 'A dark mage'} has been vanquished!`);
                setTimeout(() => { if (S.npcs[npc.id]) { Entities.removeNpc(npc.id); Net.broadcast({ type: 'despawn-npc', id: npc.id }); } }, 5000);
                setTimeout(() => isMage ? Combat.spawnMage() : Combat.spawnNpc(), isMage ? 30000 : 20000);
            },
            awardTitle: (p) => {
                if (!Net.isHost()) return;
                let best = '';
                for (const t in C.TITLES) if (p[C.TITLES[t].req] >= C.TITLES[t].val) best = t;
                if (best && p.title !== best) { p.title = best; Combat.announce(`${p.name} has earned the title: ${best}!`); Net.broadcast({ type: 'title-update', playerId: p.id, title: p.title }); }
            },
            spawnNpc: () => {
                if (!Net.isHost()) return;
                const sp = Util.safeSpawn();
                const id = `npc_${Date.now()}_${Math.random()}`;
                const d = { id, x: sp.x, y: sp.y, health: C.SLIME_HP, maxHealth: C.SLIME_HP, isDead: false };
                Entities.createNpc(d);
                const n = S.npcs[id]; if (n) { n.aiCD = false; }
                Net.broadcast({ type: 'spawn-npc', npc: Entities.serialNpc(n) });
            },
            spawnMage: () => {
                if (!Net.isHost()) return;
                // spawn out in the wilds (right of safe zone), away from spawn point
                const id = `mage_${Date.now()}_${Math.random()}`;
                const names = ['Mordath the Dark', 'Vex Nightweaver', 'Balthor the Corrupt', 'Silas Grimwald'];
                const x = C.SAFE_X1 + 200 + Math.random() * (C.WORLD_W - C.SAFE_X1 - 400);
                const y = 100 + Math.random() * (C.WORLD_H - 200);
                const d = { id, x, y, health: C.MAGE_HP, maxHealth: C.MAGE_HP, isDead: false, kind: 'mage', name: names[Math.floor(Math.random() * names.length)] };
                Entities.createNpc(d);
                const n = S.npcs[id]; if (n) { n.aiCD = false; n.castCD = false; }
                Net.broadcast({ type: 'spawn-npc', npc: Entities.serialNpc(n) });
            },
            npcAI: () => {
                if (!Net.isHost()) return;
                for (const id in S.npcs) {
                    const n = S.npcs[id]; if (n.isDead) continue;
                    const isMage = n.kind === 'mage';
                    const aggro = isMage ? C.MAGE_AGGRO : C.SLIME_AGGRO;
                    let tgt = null, min = aggro;
                    for (const pid in S.players) { const pl = S.players[pid]; if (pl.isDead || Util.inSafe(pl.x)) continue; const d = Util.dist(n.x, n.y, pl.x, pl.y); if (d < min) { min = d; tgt = pl; } }
                    let moved = false;
                    if (tgt && isMage) {
                        // Mage AI: kite to keep at cast range, then cast spells
                        let dx = tgt.x - n.x, dy = tgt.y - n.y, m = Math.hypot(dx, dy) || 1;
                        if (min < C.MAGE_KITE) { dx = -dx; dy = -dy; } // too close: back away
                        if (min < C.MAGE_KITE || min > C.MAGE_CAST_RANGE) {
                            let nx = n.x + dx / m * C.MAGE_SPEED, ny = n.y + dy / m * C.MAGE_SPEED;
                            if (Util.inBuilding(nx, n.y)) nx = n.x; if (Util.inBuilding(n.x, ny)) ny = n.y;
                            if (!Util.inWater(nx, ny)) { n.x = nx; n.y = ny; moved = true; }
                        }
                        if (min <= C.MAGE_CAST_RANGE && !n.castCD) {
                            n.castCD = true;
                            const spells = ['magic_arrow', 'lightning', 'flamestrike'];
                            const spellId = spells[Math.floor(Math.random() * spells.length)];
                            n.el.classList.add('casting');
                            Net.broadcast({ type: 'npc-cast', id: n.id, casting: true });
                            const target = tgt;
                            setTimeout(() => {
                                n.el.classList.remove('casting');
                                Net.broadcast({ type: 'npc-cast', id: n.id, casting: false });
                                if (n.isDead || target.isDead || Util.inSafe(target.x)) return;
                                if (Util.dist(n.x, n.y, target.x, target.y) > C.MAGE_CAST_RANGE + 60) return;
                                const projId = `mp_${Date.now()}_${Math.random()}`;
                                Net.broadcast({ type: 'spawn-projectile', projectileId: projId, casterId: n.id, targetId: target.id, spellId, travelTime: 500 });
                                Game.spawnProjectile(projId, n.id, target.id, spellId, 500);
                                Combat.inCombat(target); if (target.isCasting) Combat.interrupt(target, 'interrupted by damage');
                                target.health -= C.MAGE_DMG;
                                Combat.announce(`${n.name} strikes ${target.name} with ${spellId.replace('_', ' ')}!`);
                                if (target.health <= 0) { target.health = 0; target.isDead = true; Combat.announce(`${target.name} was slain by ${n.name}!`); target.deaths++; Combat.awardTitle(target); Combat.playerDeath(target, n); }
                                Net.broadcast({ type: 'update-health', id: target.id, health: target.health, isDead: target.isDead, attackerId: n.id });
                                Util.trigger(target.el, 'damage-flash');
                            }, 700);
                            setTimeout(() => { n.castCD = false; }, C.MAGE_CAST_CD);
                        }
                    } else if (tgt) {
                        if (min > C.SLIME_ATK_RANGE) {
                            const dx = tgt.x - n.x, dy = tgt.y - n.y, m = Math.hypot(dx, dy);
                            let nx = n.x + dx / m * C.SLIME_SPEED, ny = n.y + dy / m * C.SLIME_SPEED;
                            if (Util.inBuilding(nx, n.y)) nx = n.x; if (Util.inBuilding(n.x, ny)) ny = n.y;
                            if (!Util.inWater(nx, ny)) { n.x = nx; n.y = ny; moved = true; }
                        }
                        if (min <= C.SLIME_ATK_RANGE && !n.aiCD) {
                            Combat.inCombat(tgt); if (tgt.isCasting) Combat.interrupt(tgt, 'interrupted by damage');
                            tgt.health -= C.SLIME_DMG; Combat.announce(`A slime attacks ${tgt.name}!`);
                            if (tgt.health <= 0) { tgt.health = 0; tgt.isDead = true; Combat.announce(`${tgt.name} has been slain by a slime!`); tgt.deaths++; Combat.awardTitle(tgt); Combat.playerDeath(tgt, n); }
                            Net.broadcast({ type: 'update-health', id: tgt.id, health: tgt.health, isDead: tgt.isDead, attackerId: n.id });
                            Util.trigger(tgt.el, 'damage-flash'); n.aiCD = true; setTimeout(() => { n.aiCD = false; }, 1000);
                        }
                    }
                    if (moved) { n.x = Util.clamp(n.x, 0, C.WORLD_W - C.PLAYER_SIZE); n.y = Util.clamp(n.y, 0, C.WORLD_H - C.PLAYER_SIZE); Net.broadcast({ type: 'npc-move', id: n.id, x: n.x, y: n.y }); }
                }
            },
            resurrect: () => {
                if (!Net.isHost()) return;
                for (const id in S.players) {
                    const p = S.players[id];
                    if (!p.isDead) continue;
                    const onShrine = Util.dist(C.SHRINE_X + C.SHRINE_R, C.SHRINE_Y + C.SHRINE_R, p.x + C.PLAYER_RADIUS, p.y + C.PLAYER_RADIUS) < C.SHRINE_R;
                    if (onShrine && !p.resTime) { p.resTime = Date.now(); Combat.msgPlayer(id, 'You feel the shrine\'s power begin to restore your life force...'); }
                    else if (!onShrine && p.resTime) { p.resTime = null; Combat.msgPlayer(id, 'You moved away and broke the connection to the shrine.'); }
                    else if (onShrine && p.resTime && Date.now() - p.resTime >= C.RES_TIME) { p.health = C.MAX_HEALTH; p.isDead = false; p.resTime = null; Combat.announce(`${p.name} has been resurrected!`); Net.broadcast({ type: 'update-health', id: id, health: p.health, isDead: p.isDead }); }
                }
            },
            idle: () => {
                if (!Net.isHost()) return;
                const now = Date.now();
                for (const id in S.players) {
                    const p = S.players[id];
                    if (!p.isDead && !p.idleKicked && now - p.lastInput > C.IDLE_TO) {
                        p.idleKicked = true;
                        p.x = C.IDLE_ZONE.x + Math.random() * (C.IDLE_ZONE.w - C.PLAYER_SIZE);
                        p.y = C.IDLE_ZONE.y + Math.random() * (C.IDLE_ZONE.h - C.PLAYER_SIZE);
                        Combat.announce(`${p.name} was moved to the idle area for being inactive.`);
                        Net.broadcast({ type: 'move', id: p.id, x: p.x, y: p.y });
                    }
                }
            }
        };

        /* ============================ EFFECTS ============================ */
        const FX = {
            fizzle: (caster) => {
                if (!caster) return;
                const e = Util.make('fizzle-effect', D.worldC);
                const sz = 40, cx = caster.x + C.PLAYER_RADIUS, cy = caster.y + C.PLAYER_RADIUS;
                e.style.left = (cx - sz / 2) + 'px'; e.style.top = (cy - sz / 2) + 'px';
                setTimeout(() => e.remove(), 700);
            },
            spell: (el, id) => {
                const e = document.createElement('div'); e.style.position = 'absolute'; e.style.pointerEvents = 'none'; e.style.zIndex = 100;
                const map = { magic_arrow: ['➤', '#e0aaff', 30], lightning: ['⚡', '#f0e68c', 40], flamestrike: ['🔥', '#ff6a00', 50], poison: ['☠', '#4CAF50', 40] };
                const v = map[id] || ['•', '#fff', 30];
                e.textContent = v[0]; e.style.color = v[1]; e.style.fontSize = v[2] + 'px';
                el.appendChild(e); setTimeout(() => e.remove(), 800);
            }
        };
        Util.trigger = (el, cls) => { if (!el) return; el.classList.add(cls); setTimeout(() => el.classList.remove(cls), 500); };

        /* ============================ NETWORK ============================ */
        const Net = {
            isHost: () => S.isHost,
            send: (data) => { if (S.observer) return; if (S.isHost) { Net.handle(data, S.localId); } else { const h = S.conns[C.HOST_ID]; if (h && h.open) h.send(data); } },
            broadcast: (data) => { for (const id in S.conns) { const c = S.conns[id]; if (c && c.open) c.send(data); } },
            connect: (name) => {
                D.status.textContent = 'Finding game...';
                S._resolved = false; S._mqtt = null; S._hostPeerId = null;
                const finalizeAs = (id, isHost) => {
                    if (S._resolved) return; S._resolved = true; S.isHost = isHost; S.localId = id;
                    if (isHost) setInterval(Net.manaRegen, C.MANA_INT);
                    Game.finalize(name);
                };
                Net._finalizeAs = finalizeAs;
                // ---- MQTT rendezvous (host discovery only; NOT game data) ----
                try {
                    const mqtt = new MQTT.Client(C.MQTT_WS, 'uob_' + Math.random().toString(36).slice(2));
                    S._mqtt = mqtt;
                    mqtt.onConnectionLost = () => {};
                    mqtt.onMessageArrived = (msg) => {
                        if (msg.destinationName !== C.ROOM + '/host') return;
                        const pid = msg.payloadString;
                        if (pid && pid !== S.localId && !S._hostPeerId && !S._resolved) {
                            S._hostPeerId = pid;
                            D.status.textContent = 'Joining game...';
                            S.peer.connect(pid, { reliable: true });
                        }
                    };
                    mqtt.onConnected = () => {
                        mqtt.subscribe(C.ROOM + '/host');
                        if (S.isHost) Net.announceHost();
                    };
                    mqtt.connect({ useSSL: true, keepAliveInterval: 30, reconnect: true });
                } catch (e) { console.warn('MQTT init failed', e); }

                const tryHost = () => {
                    D.status.textContent = 'Creating game...';
                    S.peer = new Peer(C.HOST_ID);
                    S.peer.on('open', (id) => {
                        finalizeAs(id, true);
                        S.peer.on('connection', (c) => Net.setup(c));
                        if (S._mqtt) Net.announceHost();
                    });
                    S.peer.on('error', (err) => {
                        if (err.type === 'unavailable-id') {
                            // someone already owns the host id -> join as client
                            D.status.textContent = 'Game found! Connecting...';
                            if (S.peer) S.peer.destroy();
                            S.peer = new Peer();
                            S.peer.on('open', (id) => {
                                S.localId = id; S._resolved = true; S.isHost = false;
                                D.status.textContent = 'Connecting to host...';
                                const conn = S.peer.connect(C.HOST_ID, { reliable: true });
                                Net.setup(conn, name);
                            });
                            S.peer.on('error', () => { if (!S._resolved) Net.solo(name); });
                        } else if (!S._resolved) { D.status.textContent = `Error: ${err.type}. Starting solo.`; Net.solo(name); }
                    });
                };

                // PeerJS first (gives us a local id so MQTT can exclude self)
                S.peer = new Peer();
                S.peer.on('open', (id) => {
                    S.localId = id;
                    D.status.textContent = 'Looking for host...';
                    setTimeout(() => { if (!S._resolved) tryHost(); }, 1200); // let MQTT find an existing host first
                });
                S.peer.on('error', () => { if (!S._resolved) Net.solo(name); });
                // safety: if nothing resolves, go solo
                setTimeout(() => { if (!S._resolved && !S._hostPeerId) { D.status.textContent = 'No game found — starting solo.'; Net.solo(name); } }, 7000);
            },
            announceHost: () => { if (!S._mqtt) return; const m = { destinationName: C.ROOM + '/host', payloadString: S.localId }; S._mqtt.publish(m); },
            solo: (name) => { if (S.localId && S.localId.indexOf(C.SOLO_PEER) === 0) { Net._finalizeAs(S.localId, true); return; } S.peer = new Peer(C.SOLO_PEER + Math.random().toString(36).slice(2, 8)); S.peer.on('open', (id) => Net._finalizeAs(id, true)); S.peer.on('error', () => Net._finalizeAs(C.SOLO_PEER + 'fallback', true)); },
            observe: () => {
                // Spectator: join an EXISTING host only; never become host/solo. No player is registered.
                D.status.textContent = 'Finding a game to observe...';
                S._resolved = false; S._mqtt = null; S._hostPeerId = null; S.observer = true;
                const joinAsObserver = () => {
                    if (S._resolved) return;
                    S.peer = new Peer();
                    S.peer.on('open', (id) => {
                        S.localId = id; S._resolved = true; S.isHost = false; S.observer = true;
                        D.status.textContent = 'Connecting to observe...';
                        const conn = S.peer.connect(C.HOST_ID, { reliable: true });
                        Net.setupObserver(conn);
                    });
                    S.peer.on('error', () => { if (!S._resolved) D.status.textContent = 'No live game found to observe. Try again shortly.'; });
                };
                // Try MQTT host discovery first, then direct HOST_ID connect.
                try {
                    const mqtt = new MQTT.Client(C.MQTT_WS, 'uobs_' + Math.random().toString(36).slice(2));
                    S._mqtt = mqtt;
                    mqtt.onConnectionLost = () => {};
                    mqtt.onMessageArrived = (msg) => {
                        if (msg.destinationName !== C.ROOM + '/host') return;
                        const pid = msg.payloadString;
                        if (pid && !S._hostPeerId && !S._resolved) {
                            S._hostPeerId = pid; S._resolved = true;
                            S.peer = new Peer();
                            S.peer.on('open', (id) => { S.localId = id; S.isHost = false; S.observer = true; D.status.textContent = 'Connecting to observe...'; Net.setupObserver(S.peer.connect(pid, { reliable: true })); });
                        }
                    };
                    mqtt.onConnected = () => { mqtt.subscribe(C.ROOM + '/host'); };
                    mqtt.connect({ useSSL: true, keepAliveInterval: 30, reconnect: true });
                } catch (e) { console.warn('MQTT init failed', e); }
                // Fallback: direct connect to well-known host id after MQTT grace period.
                setTimeout(() => { if (!S._resolved) joinAsObserver(); }, 1500);
                setTimeout(() => { if (!S._resolved) D.status.textContent = 'No live game found to observe. Try again shortly.'; }, 8000);
            },
            setupObserver: (conn) => {
                S.conns[conn.peer] = conn;
                conn.on('data', (d) => Net.client(d));
                conn.on('close', () => { Chat.log('The game you were observing has ended.', 'system'); });
                conn.on('error', (e) => console.error('Observer conn error:', e));
                conn.on('open', () => { Game.finalizeObserver(); });
            },
            setup: (conn, nameForClient) => {
                S.conns[conn.peer] = conn;
                conn.on('data', (d) => Net.handle(d, conn.peer));
                conn.on('close', () => {
                    const nm = S.players[conn.peer] ? S.players[conn.peer].name : (conn.peer.slice(0, 6) + '...');
                    Chat.log(`${nm} has disconnected.`, 'system');
                    Entities.removePlayer(conn.peer); delete S.conns[conn.peer];
                    if (S.isHost) Net.broadcast({ type: 'disconnect', id: conn.peer });
                });
                conn.on('error', (e) => console.error(`Conn error ${conn.peer}:`, e));
                if (nameForClient) conn.on('open', () => { Game.finalize(nameForClient); });
            },
            serialAll: () => {
                const ps = {}; for (const id in S.players) ps[id] = Entities.serialPlayer(S.players[id]);
                const ns = {}; for (const id in S.npcs) ns[id] = Entities.serialNpc(S.npcs[id]);
                return { players: ps, npcs: ns, items: S.items };
            },
            handle: (data, senderId) => {
                if (!S.isHost) { Net.client(data); return; }
                const sender = S.players[senderId];
                if (!sender && data.type !== 'sync-request' && data.type !== 'observer-sync') return;
                switch (data.type) {
                    case 'sync-request': {
                        const s = Net.serialAll();
                        S.conns[senderId].send({ type: 'sync-response', players: s.players, npcs: s.npcs, items: s.items });
                        const np = Entities.createPlayer(senderId, data.name);
                        Net.broadcast({ type: 'new-player', id: senderId, player: Entities.serialPlayer(np) });
                        break;
                    }
                    case 'observer-sync': {
                        // Spectator only wants world state; do NOT register them as a player.
                        const s = Net.serialAll();
                        const c = S.conns[senderId];
                        if (c && c.open) c.send({ type: 'sync-response', players: s.players, npcs: s.npcs, items: s.items });
                        break;
                    }
                    case 'move': {
                        sender.x = data.x; sender.y = data.y; sender.lastInput = Date.now(); sender.idleKicked = false;
                        Combat.pickup(sender); Net.broadcast({ type: 'move', id: senderId, x: data.x, y: data.y });
                        break;
                    }
                    case 'attack': {
                        if (sender.isDead) break;
                        const tgt = data.targetType === 'player' ? S.players[data.targetId] : S.npcs[data.targetId];
                        const tname = tgt ? (tgt.name || 'a slime') : 'someone';
                        Combat.inCombat(sender);
                        if (tgt && Util.inSafe(tgt.x)) break;
                        if (tgt && !tgt.isDead) {
                            if (data.targetType === 'player') { Combat.inCombat(tgt); if (tgt.isCasting) Combat.interrupt(tgt, 'interrupted by damage'); }
                            const dmg = sender.buffs.damage.active ? C.BASE_DMG + 5 : C.BASE_DMG;
                            tgt.health -= dmg; Combat.announce(`${sender.name} attacks ${tname}!`);
                            if (tgt.health <= 0) {
                                tgt.health = 0; tgt.isDead = true; Combat.announce(`${tname} has been slain!`);
                                tgt.deaths++; Combat.awardTitle(tgt);
                                if (data.targetType === 'player') { sender.pvpKills++; Combat.awardTitle(sender); Combat.playerDeath(tgt, sender); }
                                else if (data.targetType === 'npc') { sender.pveKills++; Combat.awardTitle(sender); Combat.dropSlimeGold(tgt); }
                            }
                            const t = data.targetType === 'player' ? 'update-health' : 'npc-update-health';
                            Net.broadcast({ type: t, id: data.targetId, health: tgt.health, isDead: tgt.isDead, attackerId: senderId });
                            Util.trigger(tgt.el, 'damage-flash');
                        }
                        break;
                    }
                    case 'buy-item': {
                        const it = C.VENDOR_ITEMS[data.itemId]; if (!it) break;
                        if (sender.gold >= it.cost) { sender.gold -= it.cost; sender.inv[data.itemId] = (sender.inv[data.itemId] || 0) + 1; Combat.msgPlayer(senderId, `You purchased a ${data.itemId.replace('_', ' ')}.`); Net.broadcast({ type: 'update-gold', playerId: senderId, gold: sender.gold }); Net.broadcast({ type: 'update-inv', playerId: senderId, inv: sender.inv }); }
                        else Combat.msgPlayer(senderId, 'You don\'t have enough gold for that.');
                        break;
                    }
                    case 'use-item': {
                        if (sender.isDead) break;
                        if (sender.inv[data.itemId] > 0) {
                            sender.inv[data.itemId]--;
                            if (data.itemId === 'health_potion') { sender.health = Math.min(C.MAX_HEALTH, sender.health + C.HEAL_POT); Combat.msgPlayer(senderId, 'You feel healthier.'); Net.broadcast({ type: 'update-health', id: senderId, health: sender.health, isDead: sender.isDead }); }
                            else if (data.itemId === 'speed_potion') { sender.buffs.speed.active = true; sender.buffs.speed.endTime = Date.now() + C.BUFF_DUR; Combat.msgPlayer(senderId, 'You feel faster!'); Net.broadcast({ type: 'buff-update', playerId: senderId, buffs: sender.buffs }); }
                            else if (data.itemId === 'damage_potion') { sender.buffs.damage.active = true; sender.buffs.damage.endTime = Date.now() + C.BUFF_DUR; Combat.msgPlayer(senderId, 'You feel stronger!'); Net.broadcast({ type: 'buff-update', playerId: senderId, buffs: sender.buffs }); }
                            Net.broadcast({ type: 'update-inv', playerId: senderId, inv: sender.inv });
                        }
                        break;
                    }
                    case 'chat': {
                        if (sender) { sender.lastInput = Date.now(); sender.idleKicked = false; }
                        if (data.message.trim().toLowerCase() === '/top') { Net.leaderboard(); }
                        else { const cd = { type: 'chat', playerId: senderId, name: sender.name, message: data.message }; Chat.log(data.message, sender.name); Chat.bubble(senderId, data.message); Net.broadcast(cd); }
                        break;
                    }
                    case 'start-cast': {
                        if (sender.isDead || !data.targetId || !data.spellId) break;
                        const spell = C.SPELLS[data.spellId]; const tgt = S.players[data.targetId] || S.npcs[data.targetId];
                        if (sender.isCasting || !spell || !tgt || tgt.isDead) break;
                        if (sender.mana < spell.manaCost) { Combat.msgPlayer(senderId, 'You don\'t have enough mana.'); break; }
                        if (Util.dist(sender.x, sender.y, tgt.x, tgt.y) > C.SPELL_RANGE) { Combat.msgPlayer(senderId, 'Your target is too far away.'); break; }
                        sender.isCasting = true; sender.castingSpell = data.spellId; sender.castingTarget = data.targetId; sender.mana -= spell.manaCost;
                        Net.broadcast({ type: 'update-mana', playerId: senderId, mana: sender.mana });
                        if (senderId === S.localId) sender.mana = sender.mana;
                        Net.broadcast({ type: 'cast-started', casterId: senderId, spell });
                        if (S.players[senderId]) { S.players[senderId].spellText.textContent = spell.words; S.players[senderId].spellText.style.opacity = '1'; S.players[senderId].spellText.style.marginBottom = '45px'; }
                        sender.castingTO = setTimeout(() => {
                            if (!sender.isCasting) return;
                            const ft = S.players[sender.castingTarget] || S.npcs[sender.castingTarget];
                            if (!ft || ft.isDead) { Combat.interrupt(sender, 'as the target is gone'); return; }
                            const sc = { x: sender.x + C.PLAYER_RADIUS, y: sender.y + C.PLAYER_RADIUS };
                            const tc = { x: ft.x + C.PLAYER_RADIUS, y: ft.y + C.PLAYER_RADIUS };
                            if (!Util.losClear(sc, tc)) { Combat.interrupt(sender, 'as the target is not in your line of sight'); return; }
                            sender.isCasting = false; Net.broadcast({ type: 'cast-finished', casterId: senderId });
                            if (S.players[senderId]) { S.players[senderId].spellText.style.opacity = '0'; S.players[senderId].spellText.style.marginBottom = '40px'; }
                            const dist = Util.dist(sender.x, sender.y, ft.x, ft.y);
                            const travel = dist / C.PROJ_SPEED * 1000;
                            const pid = `proj_${Date.now()}`;
                            const sp = { type: 'spawn-projectile', projectileId: pid, casterId: senderId, targetId: ft.id, spellId: data.spellId, travelTime: travel };
                            Net.broadcast(sp); Game.spawnProjectile(sp.projectileId, sp.casterId, sp.targetId, sp.spellId, sp.travelTime);
                            setTimeout(() => {
                                const ht = S.players[ft.id] || S.npcs[ft.id];
                                if (!ht || ht.isDead) return;
                                Combat.inCombat(sender); if (ht.name) Combat.inCombat(ht);
                                Spells.resolve(sender, ht, data.spellId);
                                Net.broadcast({ type: 'spell-effect', targetId: ht.id, spellId: data.spellId });
                                if (Net.isHost()) FX.spell(ht.el, data.spellId);
                            }, travel);
                        }, spell.castTime);
                        break;
                    }
                }
            },
            client: (data) => {
                switch (data.type) {
                    case 'sync-response': for (const id in data.players) if (id !== S.localId) Entities.createPlayer(id, data.players[id].name, false, data.players[id]); for (const id in data.npcs) Entities.createNpc(data.npcs[id]); for (const id in data.items) Entities.createItem(data.items[id]); break;
                    case 'despawn-npc': { const n = S.npcs[data.id]; if (n && n.el) { n.el.style.opacity = '0'; setTimeout(() => Entities.removeNpc(data.id), 500); } break; }
                    case 'new-player': if (data.id !== S.localId) { Entities.createPlayer(data.id, data.player.name, false, data.player); } else if (S.players[S.localId]) { const me = S.players[S.localId]; me.x = data.player.x; me.y = data.player.y; me.targetX = data.player.x; me.targetY = data.player.y; } break;
                    case 'move': if (S.players[data.id] && data.id !== S.localId) { S.players[data.id].targetX = data.x; S.players[data.id].targetY = data.y; } break;
                    case 'update-health': { const p = S.players[data.id]; if (p) { Util.trigger(p.el, 'damage-flash'); p.health = data.health; p.isDead = data.isDead; } break; }
                    case 'update-gold': if (S.players[data.playerId]) S.players[data.playerId].gold = data.gold; break;
                    case 'update-inv': if (S.players[data.playerId]) S.players[data.playerId].inv = data.inv; break;
                    case 'chat': Chat.log(data.message, data.name); if (data.playerId && data.name !== 'system') Chat.bubble(data.playerId, data.message); break;
                    case 'disconnect': Entities.removePlayer(data.id); break;
                    case 'spawn-npc': Entities.createNpc(data.npc); break;
                    case 'npc-cast': { const n = S.npcs[data.id]; if (n && n.el) n.el.classList.toggle('casting', data.casting); break; }
                    case 'npc-move': if (S.npcs[data.id]) { S.npcs[data.id].x = data.x; S.npcs[data.id].y = data.y; } break;
                    case 'npc-update-health': { const n = S.npcs[data.id]; if (n) { Util.trigger(n.el, 'damage-flash'); n.health = data.health; n.isDead = data.isDead; } break; }
                    case 'spawn-item': Entities.createItem(data.item); break;
                    case 'remove-item': Entities.removeItem(data.id); break;
                    case 'combat-status': { const p = S.players[data.playerId]; if (p) { p.inCombat = data.inCombat; p.el.classList.toggle('in-combat', data.inCombat); } break; }
                    case 'title-update': if (S.players[data.playerId]) S.players[data.playerId].title = data.title; break;
                    case 'update-mana': if (S.players[data.playerId]) { S.players[data.playerId].mana = data.mana; if (data.playerId === S.localId) S.players[S.localId].mana = data.mana; } break;
                    case 'cast-started': { const c = S.players[data.casterId]; if (c) { c.spellText.textContent = data.spell.words; c.spellText.style.opacity = '1'; c.spellText.style.marginBottom = '45px'; } break; }
                    case 'cast-finished': { const c = S.players[data.casterId]; if (c) { c.spellText.style.opacity = '0'; c.spellText.style.marginBottom = '40px'; } break; }
                    case 'spell-effect': { const el = (S.players[data.targetId] || {}).el || (S.npcs[data.targetId] || {}).el; if (el) FX.spell(el, data.spellId); break; }
                    case 'spawn-projectile': Game.spawnProjectile(data.projectileId, data.casterId, data.targetId, data.spellId, data.travelTime); break;
                    case 'fizzle': { const c = S.players[data.casterId]; if (c) FX.fizzle(c); break; }
                    case 'buff-update': { const e = S.players[data.playerId] || S.npcs[data.playerId]; if (e) { if (!e.buffs) e.buffs = {}; e.buffs = data.buffs; } break; }
                }
            },
            manaRegen: () => { if (!S.isHost) return; for (const id in S.players) { const p = S.players[id]; if (!p.isDead && p.mana < p.maxMana) { p.mana = Math.min(p.maxMana, p.mana + C.MANA_REGEN); Net.broadcast({ type: 'update-mana', playerId: id, mana: p.mana }); } } },
            leaderboard: () => {
                if (!S.isHost) return;
                const sorted = Object.values(S.players).sort((a, b) => b.gold - a.gold);
                let m = '--- Top Brawlers (by Gold) ---';
                if (!sorted.length) m += '\nNo brawlers yet!';
                else sorted.slice(0, 5).forEach((p, i) => { m += `\n#${i + 1}: ${p.name}${p.title ? ' ' + p.title : ''} - ${p.gold}g`; });
                Combat.announce(m);
            }
        };
        Combat.pickup = (p) => {
            if (p.isDead) return;
            const R = C.PLAYER_RADIUS + 5;
            for (const id in S.items) {
                const it = S.items[id];
                if (Util.dist(p.x + C.PLAYER_RADIUS, p.y + C.PLAYER_RADIUS, it.x + C.GOLD_SIZE / 2, it.y + C.GOLD_SIZE / 2) < R) {
                    if (it.type === 'gold') p.gold += it.amount;
                    Entities.removeItem(id); Net.broadcast({ type: 'remove-item', id });
                    Net.broadcast({ type: 'update-gold', playerId: p.id, gold: p.gold });
                    Combat.announce(`${p.name} picked up ${it.amount} gold.`);
                    break;
                }
            }
        };

        /* ============================ GAME ============================ */
        const Game = {
            finalize: (name) => {
                D.login.style.display = 'none'; D.container.style.display = 'block';
                Entities.createPlayer(S.localId, name, true);
                if (S.isHost) {
                    S.players[S.localId].isHost = true;
                    for (let i = 0; i < C.MAX_NPCS; i++) Combat.spawnNpc();
                    for (let i = 0; i < C.MAX_MAGES; i++) Combat.spawnMage();
                } else {
                    const h = S.conns[C.HOST_ID];
                    if (h && h.open) Net.send({ type: 'sync-request', name });
                }
                Game.loop();
            },
            finalizeObserver: () => {
                D.login.style.display = 'none'; D.container.style.display = 'block';
                // No local player is created — observer roams the map as a free camera.
                S.localId = S.localId || 'observer';
                Chat.log('👁 You are now observing. You cannot attack, cast, or be targeted.', 'system');
                const h = S.conns[C.HOST_ID];
                if (h && h.open) Net.send({ type: 'observer-sync' });
                // Banner + lock combat UI
                Game.applyObserverLock();
                Game.loop();
            },
            applyObserverLock: () => {
                // Hide/disable combat controls; show spectator banner + controller.
                if (D.vendorMenu) D.vendorMenu.style.display = 'none';
                const banner = document.createElement('div');
                banner.id = 'observer-banner';
                banner.textContent = '👁 OBSERVING — you cannot interfere';
                document.body.appendChild(banner);
                Obs.show();
            },
            spawnProjectile: (id, casterId, targetId, spellId, travel) => {
                if (S.projectiles[id]) return;
                const caster = S.players[casterId] || S.npcs[casterId], tgt = S.players[targetId] || S.npcs[targetId];
                if (!caster || !tgt) return;
                const el = Util.make('spell-projectile', D.worldC);
                const vis = { magic_arrow: ['➤', '#e0aaff'], lightning: ['⚡', '#f0e68c'], flamestrike: ['🔥', '#ff6a00'], poison: ['●', '#4CAF50'] };
                el.textContent = (vis[spellId] || ['•', '#fff'])[0]; el.style.color = (vis[spellId] || ['•', '#fff'])[1];
                const sx = caster.x + C.PLAYER_RADIUS, sy = caster.y + C.PLAYER_RADIUS;
                el.style.left = sx + 'px'; el.style.top = sy + 'px';
                S.projectiles[id] = { id, el, spellId, sx, sy, ex: tgt.x + C.PLAYER_RADIUS, ey: tgt.y + C.PLAYER_RADIUS, targetId, start: Date.now(), travel };
                setTimeout(() => { el.remove(); delete S.projectiles[id]; }, travel + 100);
            },
            updateProjectiles: () => {
                const now = Date.now();
                for (const id in S.projectiles) {
                    const p = S.projectiles[id]; const t = S.players[p.targetId] || S.npcs[p.targetId];
                    const tx = t ? t.x + C.PLAYER_RADIUS : p.ex, ty = t ? t.y + C.PLAYER_RADIUS : p.ey;
                    const f = Math.min(1, (now - p.start) / p.travel);
                    p.x = p.sx + (tx - p.sx) * f; p.y = p.sy + (ty - p.sy) * f;
                    p.el.style.left = p.x + 'px'; p.el.style.top = p.y + 'px';
                }
            },
            camera: () => {
                const me = S.players[S.localId];
                const vw = parseInt(getComputedStyle(D.world).width), vh = parseInt(getComputedStyle(D.world).height);
                const z = S.obsZoom || 1;
                if (S.observer) {
                    // Effective visible area scales inversely with zoom. Center on obsX/obsY.
                    const visW = vw / z, visH = vh / z;
                    S.camX = Util.clamp(S.obsX - visW / 2, 0, Math.max(0, C.WORLD_W - visW));
                    S.camY = Util.clamp(S.obsY - visH / 2, 0, Math.max(0, C.WORLD_H - visH));
                    return;
                }
                if (!me) return;
                S.camX = Util.clamp(me.x - vw / 2 + C.PLAYER_RADIUS, 0, C.WORLD_W - vw);
                S.camY = Util.clamp(me.y - vh / 2 + C.PLAYER_RADIUS, 0, C.WORLD_H - vh);
            },
            boat: () => {
                S.boatX += 0.5 * S.boatDir;
                if (S.boatX > 2000 || S.boatX < 800) { S.boatDir *= -1; D.boat.style.transform = `scaleX(${S.boatDir})`; }
                D.boat.style.left = S.boatX + 'px'; D.boat.style.top = S.boatY + 'px';
            },
            input: () => {
                if (S.observer) {
                    // Free-roam camera: WASD/arrows pan the observer viewpoint.
                    let dx = 0, dy = 0;
                    if (S.keys['w'] || S.keys['arrowup']) dy--; if (S.keys['s'] || S.keys['arrowdown']) dy++;
                    if (S.keys['a'] || S.keys['arrowleft']) dx--; if (S.keys['d'] || S.keys['arrowright']) dx++;
                    const mag = Math.hypot(dx, dy);
                    if (mag >= 1) { const sp = C.BASE_SPEED * 1.6; S.obsX = Util.clamp(S.obsX + dx / mag * sp, 0, C.WORLD_W); S.obsY = Util.clamp(S.obsY + dy / mag * sp, 0, C.WORLD_H); }
                    return;
                }
                const me = S.players[S.localId];
                if (!me || document.activeElement === D.chatIn || D.vendorMenu.style.display === 'block') { if (S.moveMouse) S.moveMouse = false; return; }
                let dx = 0, dy = 0;
                if (S.moveMouse) { dx = S.mouseTarget.x - (me.x + C.PLAYER_RADIUS); dy = S.mouseTarget.y - (me.y + C.PLAYER_RADIUS); }
                else { if (S.keys['w']) dy--; if (S.keys['s']) dy++; if (S.keys['a']) dx--; if (S.keys['d']) dx++; }
                const mag = Math.hypot(dx, dy);
                if (mag < 1) return;
                const sp = me.buffs.speed.active ? C.BASE_SPEED * 1.5 : C.BASE_SPEED;
                let nx, ny;
                if (S.moveMouse) { const d = Math.min(mag, sp); nx = me.x + dx / mag * d; ny = me.y + dy / mag * d; }
                else { nx = me.x + dx / mag * sp; ny = me.y + dy / mag * sp; }
                if (Util.inWater(nx, me.y)) nx = me.x; if (Util.inWater(me.x, ny)) ny = me.y;
                if (!me.isDead) {
                    for (const id in S.players) { const o = S.players[id]; if (id === S.localId || o.isDead) continue; if (Util.dist(nx + C.PLAYER_RADIUS, me.y + C.PLAYER_RADIUS, o.x + C.PLAYER_RADIUS, o.y + C.PLAYER_RADIUS) < C.PLAYER_SIZE) nx = me.x; if (Util.dist(me.x + C.PLAYER_RADIUS, ny + C.PLAYER_RADIUS, o.x + C.PLAYER_RADIUS, o.y + C.PLAYER_RADIUS) < C.PLAYER_SIZE) ny = me.y; }
                    for (const b of C.BUILDINGS) { if (Util.inBuilding(nx, me.y)) nx = me.x; if (Util.inBuilding(me.x, ny)) ny = me.y; }
                }
                const ox = me.x, oy = me.y;
                me.x = Util.clamp(nx, 0, C.WORLD_W - C.PLAYER_SIZE); me.y = Util.clamp(ny, 0, C.WORLD_H - C.PLAYER_SIZE);
                if (me.x !== ox || me.y !== oy) Net.send({ type: 'move', x: me.x, y: me.y });
            },
            autoAttack: () => {
                if (S.observer) return;
                if (!S.autoAttack || !S.targetId || S.attackCD) return;
                const me = S.players[S.localId];
                const tgt = S.players[S.targetId] || S.npcs[S.targetId];
                if (!me || me.isDead || !tgt || tgt.isDead) { Game.clearTarget(); return; }
                const d = Util.dist(me.x + C.PLAYER_RADIUS, me.y + C.PLAYER_RADIUS, tgt.x + C.PLAYER_RADIUS, tgt.y + C.PLAYER_RADIUS);
                if (d <= C.ATTACK_RANGE) Combat.attack(S.targetId, tgt.name ? 'player' : 'npc', true);
            },
            castKey: (key) => {
                if (Game.observerBlocked()) return;
                if (!S.targetId) { Chat.log('You must have a target to cast a spell.', 'system'); return; }
                const id = Spells.byKey(key); if (id) Net.send({ type: 'start-cast', spellId: id, targetId: S.targetId });
            },
            clickWorld: (e) => {
                const me = S.players[S.localId]; if (!me || me.isDead) return;
                if (S.observer) { S.moveMouse = false; return; } // observers roam; cannot target
                const r = D.world.getBoundingClientRect();
                const cx = e.clientX - r.left + S.camX, cy = e.clientY - r.top + S.camY;
                const dv = Util.dist(cx, cy, C.VENDOR_X + C.VENDOR_SIZE / 2, C.VENDOR_Y + C.VENDOR_SIZE / 2);
                if (dv < C.VENDOR_SIZE / 2) {
                    const dp = Util.dist(me.x + C.PLAYER_RADIUS, me.y + C.PLAYER_RADIUS, C.VENDOR_X + C.VENDOR_SIZE / 2, C.VENDOR_Y + C.VENDOR_SIZE / 2);
                    if (dp < C.VENDOR_RANGE) D.vendorMenu.style.display = 'block'; else Chat.log('You are too far away from the vendor.', 'system');
                    S.moveMouse = false; return;
                }
                let fid = null, fname = '';
                for (const id in S.players) { const p = S.players[id]; if (id !== S.localId && !p.isDead && cx >= p.x && cx <= p.x + C.PLAYER_SIZE && cy >= p.y && cy <= p.y + C.PLAYER_SIZE) { fid = id; fname = p.name; break; } }
                if (!fid) for (const id in S.npcs) { const n = S.npcs[id]; if (!n.isDead && cx >= n.x && cx <= n.x + C.PLAYER_SIZE && cy >= n.y && cy <= n.y + C.PLAYER_SIZE) { fid = id; fname = 'a slime'; break; } }
                if (fid) { S.moveMouse = false; S.targetId = fid; S.autoAttack = true; Chat.log(`You begin attacking ${fname}.`, 'system'); }
                else { if (S.autoAttack) Chat.log('You are no longer attacking.', 'system'); S.autoAttack = false; }
            },
            cycleTarget: () => {
                if (Game.observerBlocked()) return;
                const me = S.players[S.localId]; if (!me) return;
                const all = Object.values(S.players).concat(Object.values(S.npcs));
                const valid = all.filter(t => t.id !== S.localId && !t.isDead && !Util.inSafe(t.x)).map(t => ({ id: t.id, name: t.name, dist: Util.dist(me.x, me.y, t.x, t.y) })).filter(t => t.dist < 400).sort((a, b) => a.dist - b.dist);
                if (!valid.length) { Game.clearTarget(); return; }
                const i = valid.findIndex(t => t.id === S.targetId);
                const next = valid[(i + 1) % valid.length];
                S.targetId = next.id; S.autoAttack = true;
                Chat.log(`You begin attacking ${next.name || 'a slime'}.`, 'system');
            },
            clearTarget: () => { if (S.autoAttack) Chat.log('You are no longer attacking.', 'system'); S.autoAttack = false; S.targetId = null; },
            observerBlocked: () => { if (S.observer) { Chat.log('👁 Observers cannot attack or cast.', 'system'); return true; } return false; },
            UI: () => {
                D.worldC.style.transform = `translate(${-S.camX}px, ${-S.camY}px) scale(${S.obsZoom})`;
                document.querySelectorAll('.targeted-entity').forEach(el => el.classList.remove('targeted-entity'));
                for (const id in S.players) {
                    const p = S.players[id];
                    p.el.style.left = p.x + 'px'; p.el.style.top = p.y + 'px';
                    p.nameTag.textContent = `${p.isHost ? '👑 ' : ''}${p.name} ${p.title || ''}`.trim();
                    p.healthInner.style.width = (p.health / C.MAX_HEALTH) * 100 + '%';
                    p.el.classList.toggle('ghost', p.isDead);
                    p.el.classList.toggle('speed-buff', p.buffs.speed.active);
                    p.el.classList.toggle('damage-buff', p.buffs.damage.active);
                    p.el.classList.toggle('poisoned', p.buffs.poison.active);
                }
                for (const id in S.npcs) { const n = S.npcs[id]; if (!n.el) continue; n.el.style.left = n.x + 'px'; n.el.style.top = n.y + 'px'; n.healthInner.style.width = (n.health / n.maxHealth) * 100 + '%'; n.el.classList.toggle('ghost', n.isDead); n.el.classList.toggle('poisoned', n.buffs.poison.active); }
                for (const id in S.items) { const it = S.items[id]; if (it.el) { it.el.style.left = it.x + 'px'; it.el.style.top = it.y + 'px'; } }
                if (S.targetId) { const t = S.players[S.targetId] || S.npcs[S.targetId]; if (t && !t.isDead) { t.el.classList.add('targeted-entity'); D.tgtDisplay.style.display = 'block'; D.tgtName.textContent = (t.name || 'a slime') + ' ' + Math.max(0, Math.ceil(t.health)) + '/' + (t.maxHealth || C.MAX_HEALTH); D.tgtBar.style.width = (t.health / (t.maxHealth || C.MAX_HEALTH)) * 100 + '%'; } else Game.clearTarget(); }
                else D.tgtDisplay.style.display = 'none';
                const me = S.players[S.localId];
                if (me) { D.gold.textContent = `Gold: ${me.gold}`; D.mana.textContent = `Mana: ${Math.floor(me.mana)}`; D.inv.textContent = `Pots: H[${me.inv.health_potion}] S[${me.inv.speed_potion}] D[${me.inv.damage_potion}]`; }
            },
            poison: () => {
                if (!S.isHost) return;
                const now = Date.now();
                const all = Object.values(S.players).concat(Object.values(S.npcs));
                for (const e of all) {
                    if (!e.buffs || !e.buffs.poison.active) continue;
                    const pd = e.buffs.poison;
                    if (now > pd.endTime) { pd.active = false; if (e.name) Combat.msgPlayer(e.id, 'The poison has worn off.'); Net.broadcast({ type: 'buff-update', playerId: e.id, buffs: e.buffs }); continue; }
                    if (now - pd.lastTick >= pd.tickInt) {
                        pd.lastTick = now; if (e.isDead) continue;
                        e.health = Math.max(0, e.health - pd.tickDmg); Util.trigger(e.el, 'damage-flash');
                        if (e.name) Combat.msgPlayer(e.id, `You take ${pd.tickDmg} damage from poison.`);
                        if (e.isCasting) Combat.interrupt(e, 'interrupted by poison');
                        if (e.health <= 0) {
                            e.isDead = true; const tn = e.name || 'a slime'; const caster = S.players[pd.casterId];
                            Combat.announce(`${tn} has succumbed to poison!`);
                            if (e.name) { e.deaths++; Combat.awardTitle(e); if (caster) { caster.pvpKills++; Combat.awardTitle(caster); } Combat.playerDeath(e, caster || { id: 'npc_poison' }); }
                            else { if (caster) { caster.pveKills++; Combat.awardTitle(caster); } Combat.dropSlimeGold(e); }
                        }
                        Net.broadcast({ type: e.name ? 'update-health' : 'npc-update-health', id: e.id, health: e.health, isDead: e.isDead });
                    }
                }
            },
            buffs: () => {
                if (!S.isHost) return;
                const now = Date.now();
                for (const id in S.players) { const p = S.players[id]; for (const b in p.buffs) { if (b === 'poison') continue; const bf = p.buffs[b]; if (bf.active && now > bf.endTime) { bf.active = false; Combat.msgPlayer(id, `Your ${b.replace('_', ' ')} potion has worn off.`); Net.broadcast({ type: 'buff-update', playerId: id, buffs: p.buffs }); } } }
            },
            loop: () => {
                Game.input();
                Game.autoAttack();
                if (S.isHost) { Combat.npcAI(); Combat.resurrect(); Combat.tickCombat(); Combat.idle(); Game.buffs(); Game.poison(); }
                for (const id in S.players) { if (id === S.localId) continue; const p = S.players[id]; p.x += (p.targetX - p.x) * C.INTERP; p.y += (p.targetY - p.y) * C.INTERP; }
                Game.boat(); Game.updateProjectiles(); Game.camera(); Game.UI();
                requestAnimationFrame(Game.loop);
            }
        };

        /* ============================ MOBILE ============================ */
        const Mobile = {
            init: () => {
                const joy = Util.el('joy'), knob = Util.el('joyKnob');
                let jid = null, jcx = 0, jcy = 0;
                const setMove = (dx, dy) => {
                    const m = Math.hypot(dx, dy); if (m < 8) { S.keys['w'] = S.keys['a'] = S.keys['s'] = S.keys['d'] = false; knob.style.transform = 'translate(0,0)'; return; }
                    const ang = Math.atan2(dy, dx); knob.style.transform = `translate(${Math.cos(ang) * 24}px, ${Math.sin(ang) * 24}px)`;
                    S.keys['w'] = dy < -8; S.keys['s'] = dy > 8; S.keys['a'] = dx < -8; S.keys['d'] = dx > 8;
                };
                const start = (e) => { const t = e.changedTouches ? e.changedTouches[0] : e; jid = t.identifier; const r = joy.getBoundingClientRect(); jcx = r.left + r.width / 2; jcy = r.top + r.height / 2; setMove(t.clientX - jcx, t.clientY - jcy); e.preventDefault(); };
                const move = (e) => { for (const t of (e.changedTouches || [e])) if (t.identifier === jid) { setMove(t.clientX - jcx, t.clientY - jcy); e.preventDefault(); } };
                const end = (e) => { for (const t of (e.changedTouches || [e])) if (t.identifier === jid) { jid = null; setMove(0, 0); } };
                joy.addEventListener('touchstart', start, { passive: false }); joy.addEventListener('touchmove', move, { passive: false }); joy.addEventListener('touchend', end); joy.addEventListener('touchcancel', end);
                const hold = (id, on, off) => { const b = Util.el(id); const dn = (e) => { on(); e.preventDefault(); }; const up = (e) => { if (off) off(); e.preventDefault(); }; b.addEventListener('touchstart', dn, { passive: false }); b.addEventListener('touchend', up); };
                hold('mobAtk', () => { if (!S.targetId) Game.cycleTarget(); S.autoAttack = true; }, () => { S.autoAttack = false; });
                hold('mobTgt', () => Game.cycleTarget());
                hold('mobSp1', () => Game.castKey('1'));
                hold('mobSp2', () => Game.castKey('2'));
                hold('mobSp3', () => Game.castKey('3'));
                hold('mobSp4', () => Game.castKey('4'));
            }
        };

        /* ============================ OBSERVER CONTROLLER ============================ */
        const Obs = {
            init: () => {
                const press = (k) => { S.keys[k] = true; };
                const release = (k) => { S.keys[k] = false; };
                const bind = (id, key) => {
                    const b = Util.el(id);
                    const dn = (e) => { e.preventDefault(); press(key); b.classList.add('active'); };
                    const up = (e) => { e.preventDefault(); release(key); b.classList.remove('active'); };
                    b.addEventListener('pointerdown', dn);
                    b.addEventListener('pointerup', up);
                    b.addEventListener('pointerleave', up);
                    b.addEventListener('pointercancel', up);
                };
                bind('obs-up', 'w'); bind('obs-down', 's'); bind('obs-left', 'a'); bind('obs-right', 'd');
                D.obsFit.addEventListener('click', () => {
                    const vw = D.world.clientWidth, vh = D.world.clientHeight;
                    const z = Math.min(vw / C.WORLD_W, vh / C.WORLD_H); // fit whole map
                    S.obsZoom = z; S.obsX = C.WORLD_W / 2; S.obsY = C.WORLD_H / 2;
                    D.obsFit.classList.add('on'); D.obsReset.classList.remove('on');
                });
                D.obsReset.addEventListener('click', () => {
                    S.obsZoom = 1; D.obsFit.classList.remove('on'); D.obsReset.classList.add('on');
                });
            },
            show: () => { D.obsControls.classList.add('active'); D.obsReset.classList.add('on'); }
        };

        /* ============================ INIT ============================ */
        function init() {
            D.joinBtn.addEventListener('click', () => {
                const name = D.nameInput.value || `Player_${Math.floor(Math.random() * 1000)}`;
                D.joinBtn.disabled = true; Net.connect(name);
            });
            D.observeBtn.addEventListener('click', () => {
                D.observeBtn.disabled = true; Net.observe();
            });
            D.chatIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); const m = D.chatIn.value; if (m) { Net.send({ type: 'chat', message: m }); D.chatIn.value = ''; D.chatIn.blur(); } } });
            window.addEventListener('keydown', (e) => { const k = e.key.toLowerCase(); S.keys[k] = true; Game.key(k, e); });
            window.addEventListener('keyup', (e) => { S.keys[e.key.toLowerCase()] = false; });
            D.world.addEventListener('click', Game.clickWorld);
            D.world.addEventListener('contextmenu', (e) => e.preventDefault());
            D.world.addEventListener('mousedown', (e) => { if (e.button !== 0) return; const me = S.players[S.localId]; if (!me || document.activeElement === D.chatIn || D.vendorMenu.style.display === 'block') return; S.mouseDown = true; Mobile.setMouse(e); S.moveMouse = true; });
            window.addEventListener('mouseup', (e) => { if (e.button !== 0) return; S.mouseDown = false; S.moveMouse = false; });
            D.world.addEventListener('mousemove', (e) => { if (S.mouseDown) { Mobile.setMouse(e); S.moveMouse = true; } });
            D.closeVendor.addEventListener('click', () => { D.vendorMenu.style.display = 'none'; });
            document.querySelectorAll('.buy-btn').forEach(b => b.addEventListener('click', () => Net.send({ type: 'buy-item', itemId: b.dataset.item })));
            Mobile.init();
            Obs.init();
            D.status.textContent = 'Ready. Enter a name and join.';
        }
        Mobile.setMouse = (e) => { const r = D.world.getBoundingClientRect(); S.mouseTarget.x = e.clientX - r.left + S.camX; S.mouseTarget.y = e.clientY - r.top + S.camY; };
        Game.key = (k, e) => {
            const me = S.players[S.localId];
            if (!me || me.isDead || document.activeElement === D.chatIn || D.vendorMenu.style.display === 'block') return;
            if (k === 'enter') { D.chatIn.focus(); S.keys['enter'] = false; return; }
            switch (k) {
                case '1': case '2': case '3': case '4': if (S.targetId) Game.castKey(k); else Chat.log('You must have a target to cast a spell.', 'system'); break;
                case '6': Net.send({ type: 'use-item', itemId: 'health_potion' }); break;
                case 'tab': e.preventDefault(); Game.cycleTarget(); break;
                case 'escape': e.preventDefault(); Game.clearTarget(); break;
            }
        };

        // debug exposure (harmless; for QA)
        window.UOB = { C, Util, S, Game, Net, Combat, Entities, Spells, Mobile, _init: init };
        init();
    })();
    </script>
